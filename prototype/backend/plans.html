<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跟单运营台 · 方案</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="plans.html" data-title="方案审核与发布">
  <div id="app" style="display:flex;min-height:100vh;width:100%">
    <div class="main">
      <div class="body">
        <div class="card">
          <div class="toolbar">
            <select id="st">
              <option value="">全部状态</option>
              <option value="review">待审核</option>
              <option value="live">招募中</option>
              <option value="draft">候选</option>
              <option value="rejected">已驳回</option>
              <option value="win">已结算-全中</option>
              <option value="lose">已结算-未中</option>
            </select>
            <select id="src">
              <option value="">全部来源</option>
              <option value="algo">算法生成</option>
              <option value="manual">人工补单</option>
              <option value="ugc">用户分享</option>
            </select>
            <select id="aid">
              <option value="">全部作者</option>
            </select>
            <button class="btn ghost" id="gen">按策略生成候选</button>
            <button class="btn" id="manual">人工补单</button>
          </div>
          <p class="hint">人工补单：先选作者，每腿只填比赛 ID 和选项描述（如「主胜」「主让2球胜」）。点生成后，平台 AI 补齐赛事、玩法、赔率和方案 JSON，预览再发布。作者已上架才可以「保存并发布」。</p>
          <p class="hint">用户晒单：未改标题的提交即招募中（免审·未改标题）。只有用户改了标题才进待审核，过审/驳回；驳回原因用户可见并通知。</p>
          <p class="hint">「结算全中 / 结算未中」是整份方案的结果，不是单场：全中 = 每一腿都打中；未中 = 至少一腿没打中。正式环境应先接赛果自动判，这两颗按钮是人工兜底。</p>
          <table id="tbl"></table>
        </div>
      </div>
    </div>
  </div>
  <div class="drawer-mask" id="drawer"></div>
  <script src="js/admin.js"></script>
  <script>
    var samples = [
      { title: "午后泊松两场", legs: "布莱顿大2.5 / 佛罗伦萨主胜", odd: 3.28 },
      { title: "亚盘精选 2串1", legs: "热刺-0.5 / 勒沃库森-0.75", odd: 3.51 },
      { title: "高置信三场", legs: "巴黎主胜 / 国米-0.5 / 皇社小3.5", odd: 5.62 }
    ];
    var statusName = { on: "上架", draft: "草稿", off: "下架" };
    var manualDraft = null;

    function sourceBadge(src) {
      if (src === "ugc") return '<span class="badge ugc">用户分享</span>';
      if (src === "manual") return '<span class="badge wait">人工补单</span>';
      return '<span class="badge">算法生成</span>';
    }

    function authorOptions(selected) {
      return '<option value="">请选择作者</option>' + ADM.db.authors.map(function (a) {
        var s = ADM.strategy(a.sid);
        return "<option value='" + a.id + "'" + (a.id === selected ? " selected" : "") + ">" +
          a.name + " · " + (statusName[a.status] || a.status) + " · " + s.name + "</option>";
      }).join("");
    }

    function actorCell(p) {
      if (p.source === "ugc") {
        return ADM.esc(p.userName || "用户") + "<div class='muted'>用户晒单 · 不绑策略</div>";
      }
      var a = ADM.author(p.aid);
      var s = a ? ADM.strategy(a.sid) : null;
      return ADM.esc(a ? a.name : "—") + "<div class='muted'>" + ADM.esc(s ? s.name : "—") + "</div>";
    }

    function render() {
      ADM.syncUgc();
      var st = document.getElementById("st").value;
      var aid = document.getElementById("aid").value;
      var src = document.getElementById("src").value;
      var rows = ADM.db.plans.filter(function (p) {
        return (!st || p.status === st) && (!aid || p.aid === aid) && (!src || p.source === src);
      });
      document.getElementById("tbl").innerHTML =
        "<tr><th>方案</th><th>作者 / 来源人</th><th>注项</th><th>总赔</th><th>跟单</th><th>状态</th><th></th></tr>" +
        rows.map(function (p) {
          var extra = p.status === "rejected" && p.rejectReason
            ? "<div class='muted'>驳回：" + ADM.esc(p.rejectReason) + "</div>"
            : "";
          var audit = "";
          if (p.source === "ugc") {
            audit = p.skipAudit || p.auditNote === "免审·未改标题"
              ? " <span class='badge skip'>免审·未改标题</span>"
              : (p.titleEdited ? " <span class='badge wait'>改标题·" + (p.status === "review" ? "待审" : (p.status === "rejected" ? "已驳回" : "已审")) + "</span>" : "");
          }
          return "<tr><td><b>" + ADM.esc(p.title) + "</b><div class='muted'>" + p.id + " · " + sourceBadge(p.source) + audit + extra + "</div></td>" +
            "<td>" + actorCell(p) + "</td>" +
            "<td>" + ADM.esc(ADM.legsText(p)) + "</td><td>" + Number(p.odd).toFixed(2) + "</td>" +
            "<td>" + p.follows + " / " + p.gmv + "</td><td>" + (ADM.statusLabel[p.status] || p.status) + "</td>" +
            "<td class='row-actions'>" +
            (p.status === "review" || p.status === "draft" ? "<button class='btn sm' data-pub='" + p.id + "'>通过</button><button class='btn ghost sm' data-rej='" + p.id + "'>驳回</button>" : "") +
            (p.status === "live" ? "<button class='btn ghost sm' data-down='" + p.id + "'>下架</button>" : "") +
            (p.status === "live" ? "<button class='btn ghost sm' data-win='" + p.id + "' title='方案里每一腿都打中，整单派奖'>结算全中</button><button class='btn ghost sm' data-lose='" + p.id + "' title='至少一腿没打中，整单输'>结算未中</button>" : "") +
            "</td></tr>";
        }).join("");
    }

    function generate() {
      var liveAuthors = ADM.db.authors.filter(function (a) { return a.status === "on" && ADM.strategy(a.sid).on; });
      if (!liveAuthors.length) return alert("没有上架且策略启用的作者");
      var a = liveAuthors[Math.floor(Math.random() * liveAuthors.length)];
      var s = ADM.strategy(a.sid);
      var sample = samples[Math.floor(Math.random() * samples.length)];
      ADM.db.plans.unshift({
        id: "p" + Date.now(),
        aid: a.id,
        title: sample.title + " · " + a.name,
        status: s.auto ? "live" : "review",
        odd: sample.odd,
        follows: 0,
        gmv: 0,
        legs: sample.legs,
        source: "algo"
      });
      ADM.save();
      render();
      alert(s.auto
        ? "已按「" + s.name + "」自动发布到招募中（策略开启了自动发布）"
        : "已生成候选，进入待审核。作者：" + a.name + " / 策略：" + s.name);
    }

    function readManualRows() {
      return Array.prototype.map.call(document.querySelectorAll("#legs .leg-edit"), function (row) {
        return {
          matchId: row.querySelector("[data-f=mid]").value.trim(),
          desc: row.querySelector("[data-f=desc]").value.trim()
        };
      });
    }

    function addLegRow(leg) {
      leg = leg || { matchId: "", desc: "" };
      var box = document.getElementById("legs");
      var row = document.createElement("div");
      row.className = "leg-edit";
      row.innerHTML =
        "<div class='form'>" +
          "<div><label>比赛 ID</label><input class='field' data-f='mid' list='match-ids' placeholder='如 M1001' value='" + ADM.esc(leg.matchId) + "'></div>" +
          "<div><label>腿描述</label><input class='field' data-f='desc' placeholder='主胜 / 主让2球胜 / 大2.5' value='" + ADM.esc(leg.desc) + "'></div>" +
        "</div>" +
        "<button class='btn ghost sm' type='button' data-del style='margin-top:8px'>删除这腿</button>";
      box.appendChild(row);
      row.querySelector("[data-del]").onclick = function () {
        if (document.querySelectorAll("#legs .leg-edit").length <= 1) return alert("至少留一腿");
        row.remove();
      };
    }

    function showAuthorHint() {
      var id = document.getElementById("f-author").value;
      var hint = document.getElementById("author-hint");
      var pub = document.getElementById("save-pub");
      if (!id) {
        hint.textContent = "必须由人工指定作者。方案会挂在该作者名下，结算后计入其近 X 场。";
        pub.disabled = true;
        return;
      }
      var a = ADM.author(id);
      var s = ADM.strategy(a.sid);
      hint.textContent = a.name + " · " + (statusName[a.status] || a.status) + " · 绑定策略「" + s.name + "」· " + s.userLine;
      pub.disabled = a.status !== "on";
    }

    function saveManual(publish) {
      var aid = document.getElementById("f-author").value;
      if (!aid) return alert("请选择作者");
      var a = ADM.author(aid);
      if (publish && a.status !== "on") return alert("作者未上架，不能直接发布");
      if (!manualDraft) return alert("请先点「生成」，预览 AI 方案后再发布");
      var title = document.getElementById("f-title").value.trim();
      if (!title) return alert("请填写方案标题");
      var payload = manualDraft;
      ADM.db.plans.unshift({
        id: "p" + Date.now(),
        aid: aid,
        title: title,
        combo: payload.combo,
        status: publish ? "live" : "review",
        odd: payload.odd,
        follows: 0,
        gmv: 0,
        cutoff: payload.cutoff,
        legs: payload.legs,
        source: "manual"
      });
      ADM.save();
      document.getElementById("drawer").classList.remove("show");
      render();
    }

    function showInputStep() {
      document.getElementById("manual-input").style.display = "";
      document.getElementById("manual-preview").style.display = "none";
    }

    function showPreview(payload) {
      document.getElementById("f-title").value = payload.title;
      document.getElementById("pv-combo").textContent = payload.combo;
      document.getElementById("pv-cutoff").textContent = payload.cutoff;
      document.getElementById("total-odd").textContent = Number(payload.odd).toFixed(2);
      document.getElementById("pv-legs").innerHTML =
        "<tr><th>比赛 ID</th><th>赛事</th><th>玩法</th><th>选项</th><th>赔率</th></tr>" +
        payload.legs.map(function (leg) {
          return "<tr><td>" + ADM.esc(leg.matchId) + "</td><td>" + ADM.esc(leg.match) +
            "<div class='muted'>" + ADM.esc(leg.league) + " · " + ADM.esc(leg.time) + "</div></td>" +
            "<td>" + ADM.esc(leg.market) + "</td><td>" + ADM.esc(leg.pick) + "</td>" +
            "<td>" + Number(leg.odd).toFixed(2) + "</td></tr>";
        }).join("");
      document.getElementById("ai-json").textContent = JSON.stringify(payload, null, 2);
      document.getElementById("manual-input").style.display = "none";
      document.getElementById("manual-preview").style.display = "";
    }

    function runGenerate() {
      var aid = document.getElementById("f-author").value;
      if (!aid) return alert("请选择作者");
      var rows = readManualRows();
      if (!rows.length) return alert("至少一腿");
      var btn = document.getElementById("ai-gen");
      btn.disabled = true;
      btn.textContent = "AI 生成中…";
      setTimeout(function () {
        var result = ADM.aiBuildManual(rows);
        btn.disabled = false;
        btn.textContent = "生成";
        if (!result.ok) return alert(result.errors.join("\n"));
        result.payload.authorId = aid;
        result.payload.authorName = ADM.author(aid).name;
        manualDraft = result.payload;
        showPreview(result.payload);
        showAuthorHint();
      }, 700);
    }

    function openManual() {
      manualDraft = null;
      var book = ADM.MATCH_BOOK.map(function (m) {
        return "<div>" + m.id + " · " + m.league + " · " + ADM.matchLabel(m) + " · " + m.time + "</div>";
      }).join("");
      var options = ADM.MATCH_BOOK.map(function (m) {
        return "<option value='" + m.id + "'>" + m.id + " " + ADM.matchLabel(m) + "</option>";
      }).join("");
      ADM.openDrawer(
        "<h3>人工补单</h3>" +
        "<p class='hint' style='margin-bottom:14px'>运营只填比赛 ID 和腿描述。点生成后，平台内嵌 AI 按货盘补齐目标格式，预览确认再发布。</p>" +
        "<div class='form'>" +
          "<div class='full'><label>作者（必选，人工指定）</label>" +
          "<select class='field' id='f-author'>" + authorOptions("") + "</select>" +
          "<p class='hint' id='author-hint' style='margin-top:8px'>必须由人工指定作者。方案会挂在该作者名下，结算后计入其近 X 场。</p></div>" +
        "</div>" +
        "<div id='manual-input'>" +
          "<div class='form'>" +
            "<div class='full'><label>注项</label><div id='legs'></div>" +
            "<button class='btn ghost sm' type='button' id='add-leg'>+ 加一腿</button></div>" +
          "</div>" +
          "<details class='book-box'><summary>演示货盘（正式环境由 Agent 查实时比赛）</summary><div class='book-list'>" + book + "</div></details>" +
          "<datalist id='match-ids'>" + options + "</datalist>" +
          "<div class='toolbar' style='margin-top:16px'>" +
            "<button class='btn' id='ai-gen'>生成</button>" +
            "<button class='btn ghost' onclick='document.getElementById(\"drawer\").classList.remove(\"show\")'>取消</button>" +
          "</div>" +
        "</div>" +
        "<div id='manual-preview' style='display:none'>" +
          "<div class='preview-box'>" +
            "<div class='ai-tag'>平台 Agent 已生成 · 请核对后发布</div>" +
            "<div class='form'>" +
              "<div class='full'><label>方案标题（可改）</label><input class='field' id='f-title'></div>" +
            "</div>" +
            "<p class='hint' style='margin:10px 0 8px'><span id='pv-combo'></span> · <span id='pv-cutoff'></span></p>" +
            "<table id='pv-legs'></table>" +
            "<div class='odd-bar' style='margin-top:10px'><span>总赔率（各腿连乘）</span><b id='total-odd'>1.00</b></div>" +
            "<details class='json-wrap'><summary>目标 JSON</summary><pre class='json-box' id='ai-json'></pre></details>" +
          "</div>" +
          "<div class='toolbar' style='margin-top:16px'>" +
            "<button class='btn ghost' id='back-edit'>返回修改</button>" +
            "<button class='btn ghost' id='save-review'>保存为待审核</button>" +
            "<button class='btn' id='save-pub' disabled>保存并发布</button>" +
          "</div>" +
        "</div>"
      );
      addLegRow();
      addLegRow();
      document.getElementById("f-author").onchange = showAuthorHint;
      document.getElementById("add-leg").onclick = function () { addLegRow(); };
      document.getElementById("ai-gen").onclick = runGenerate;
      document.getElementById("back-edit").onclick = showInputStep;
      document.getElementById("save-review").onclick = function () { saveManual(false); };
      document.getElementById("save-pub").onclick = function () { saveManual(true); };
    }

    function bumpHit(aid, win) {
      var a = ADM.author(aid);
      a.n += 1;
      if (win) a.w += 1;
      if (a.n > a.x) {
        a.n = a.x;
        a.w = Math.min(a.w, a.x);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("aid").innerHTML += ADM.db.authors.map(function (a) {
        return "<option value='" + a.id + "'>" + a.name + "</option>";
      }).join("");
      render();
      document.getElementById("st").onchange = render;
      document.getElementById("src").onchange = render;
      document.getElementById("aid").onchange = render;
      document.getElementById("gen").onclick = generate;
      document.getElementById("manual").onclick = openManual;
      document.getElementById("tbl").addEventListener("click", function (e) {
        var pub = e.target.getAttribute("data-pub");
        var rej = e.target.getAttribute("data-rej");
        var down = e.target.getAttribute("data-down");
        var win = e.target.getAttribute("data-win");
        var lose = e.target.getAttribute("data-lose");
        if (!pub && !rej && !down && !win && !lose) return;
        var id = pub || rej || down || win || lose;
        var p = ADM.db.plans.filter(function (x) { return x.id === id; })[0];
        if (!p) return;
        if (pub) {
          p.status = "live";
          if (p.source === "ugc") p.auditNote = "改标题·已通过";
        }
        if (rej) {
          if (p.source === "ugc") {
            var reason = window.prompt("驳回原因（用户可见）", p.rejectReason || "盘口已变化或文案违规");
            if (reason === null) return;
            p.status = "rejected";
            p.rejectReason = reason || "未通过审核";
            p.auditNote = "改标题·已驳回";
            ADM.pushNotice({
              userId: p.uid || "u-me",
              type: "reject",
              planId: p.id,
              planTitle: p.title,
              title: "改标题未通过",
              body: (p.title || "晒单") + "：" + p.rejectReason
            });
          } else {
            p.status = "draft";
          }
        }
        if (down) {
          if (p.status === "live" && p.source === "ugc") {
            ADM.pushNotice({
              userId: p.uid || "u-me",
              type: "cutoff",
              planId: p.id,
              planTitle: p.title,
              title: "你的" + p.title + "已截止跟单",
              body: "方案已下架或截止，不再接受新的跟单。"
            });
          }
          p.status = "draft";
        }
        if (win) {
          p.status = "win";
          if (p.source !== "ugc" && p.aid) bumpHit(p.aid, true);
          if (p.source === "ugc") {
            var paid = Math.round((Number(p.gmv) || 0) * ADM.rewardPct()) / 100;
            p.rewardPaid = paid;
            ADM.pushNotice({
              userId: p.uid || "u-me", type: "settle_win", planId: p.id, planTitle: p.title,
              title: "你的" + p.title + "结算全中",
              body: "方案全中。跟单用户按现网串关派奖；你的额外奖励见下一则。"
            });
            ADM.pushNotice({
              userId: p.uid || "u-me", type: "reward", planId: p.id, planTitle: p.title,
              title: "晒单奖励已到账 " + paid.toFixed(2),
              body: "跟单总本金 " + (p.gmv || 0) + " × " + ADM.rewardPct() + "% = " + paid.toFixed(2) + "。不计入专家战绩。"
            });
          }
        }
        if (lose) {
          p.status = "lose";
          if (p.source !== "ugc" && p.aid) bumpHit(p.aid, false);
          if (p.source === "ugc") {
            p.rewardPaid = 0;
            ADM.pushNotice({
              userId: p.uid || "u-me", type: "settle_lose", planId: p.id, planTitle: p.title,
              title: "你的" + p.title + "结算未中",
              body: "方案未全中，不发放晒单额外奖励。"
            });
          }
        }
        if (p.source === "ugc") ADM.writeUgcPlan(p);
        ADM.save();
        render();
      });
    });
  </script>
</body>
</html>
